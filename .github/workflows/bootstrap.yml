name: Import and upgrade BlockNote sandbox
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned source and create export UX
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch main 'https://github.com/ethglobal/blocknote-sandbox.git' "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "9df75956a8693f3573879906663857691b8dea50"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'yarn-error.log' --exclude '.env' "$RUNNER_TEMP/upstream/" ./
          python - <<'PY'
          from pathlib import Path
          page=Path("pages/index.tsx")
          page.write_text("""import { DefaultBlockSchema } from "@blocknote/core";
          import "@blocknote/core/style.css";
          import { BlockNoteView, useBlockNote } from "@blocknote/react";
          import { useState } from "react";
          
          const MAX_EXPORT_BYTES = 2 * 1024 * 1024;
          
          function EditorSandbox() {
            const [changeCount, setChangeCount] = useState(0);
            const [message, setMessage] = useState("Changes remain in memory until you export.");
            const editor = useBlockNote<DefaultBlockSchema>({
              onEditorContentChange: () => setChangeCount((n) => n + 1),
              theme: "light",
            });
          
            function exportJson() {
              const text = JSON.stringify(editor.topLevelBlocks, null, 2);
              if (new Blob([text]).size > MAX_EXPORT_BYTES) {
                setMessage("Document is too large to export in this demo.");
                return;
              }
              const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
              const link = document.createElement("a");
              link.href = url; link.download = "sandbox-document.json"; link.click();
              URL.revokeObjectURL(url);
              setMessage("Document exported locally. No server upload occurred.");
            }
          
            return (
              <main style={{ maxWidth: 940, margin: "32px auto", padding: "0 22px", fontFamily: "system-ui" }}>
                <header style={{ borderBottom: "1px solid #e4e6f0", paddingBottom: 18, marginBottom: 24 }}>
                  <p style={{ letterSpacing: "0.14em", color: "#6654cf", fontSize: 12 }}>EDITOR LAB / EXPERIMENTAL</p>
                  <h1 style={{ fontSize: 44, letterSpacing: "-0.06em", margin: "8px 0" }}>sandbox.</h1>
                  <p style={{ color: "#64748b" }}>A distraction-free BlockNote playground. Compose rich blocks, then export your draft as JSON.</p>
                  <button onClick={exportJson} style={{ background: "#5846c4", color: "white", border: 0, borderRadius: 10, padding: "12px 20px", cursor: "pointer" }}>
                    Download JSON
                  </button>
                  <span style={{ marginLeft: 14, fontSize: 13, color: "#64748b" }}>{changeCount} editor updates</span>
                </header>
                <section aria-label="Block editor" style={{ background: "#fff", border: "1px solid #ececf3", borderRadius: 16, minHeight: 280, padding: "24px 8px" }}>
                  <BlockNoteView editor={editor} />
                </section>
                <p role="status" style={{ fontSize: 13, color: "#69778d", marginTop: 20 }}>{message}</p>
                <p style={{ fontSize: 12, color: "#8490a5" }}>Prototype only: no authentication, autosave or collaboration. Export before closing the tab.</p>
              </main>
            );
          }
          export default EditorSandbox;
          """)
          Path("README.md").write_text("""# sandbox — BlockNote Editor Lab
          
          A lightweight Next.js + BlockNote rich-text playground. This maintained edition adds:
          
          - A responsive editor workspace with clear instructions.
          - Downloadable JSON snapshot of the current block document.
          - A local-only export path, size guard and edit counter.
          - Explicit indicators that the draft is not autosaved.
          
          ## Run
          The source uses a legacy Next.js / BlockNote dependency set.
          \`\`\`bash
          yarn install
          yarn dev
          \`\`\`
          Open http://localhost:4300.
          
          ## Safety and compatibility
          - Documents remain in browser memory until exported; **no server storage is configured**.
          - The legacy dependencies may need maintenance before a public deployment.
          - The original open-source packages retain their respective licenses.
          - The repository originally contained a large \`yarn-error.log\` that is excluded from this edition.
          
          Based on [ethglobal/blocknote-sandbox](https://github.com/ethglobal/blocknote-sandbox); expanded and independently maintained as \`Aadhar-Gupta-0/sandbox\`.
          """)
          Path(".gitignore").write_text(".next/\nnode_modules/\nyarn-error.log\n.env\n.env.*\n!.env.example\n")
          Path(".github/workflows/ci.yml").parent.mkdir(parents=True,exist_ok=True)
          Path(".github/workflows/ci.yml").write_text("""name: Sandbox source integrity
          on: [push, pull_request]
          jobs:
            source:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: test -s pages/index.tsx && test -s package.json && test -s README.md
                - run: test ! -e yarn-error.log
          """)
          
          PY
          test -s pages/index.tsx
          test ! -e yarn-error.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve BlockNote editor lab with local JSON export'
          git push origin HEAD:main
